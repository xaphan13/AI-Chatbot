<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .message-bubble {
            animation: fadeIn 0.3s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .typing-indicator::after {
            content: '';
            animation: typing 1.5s infinite;
        }
        
        @keyframes typing {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen">
    <div class="flex flex-col h-screen max-w-6xl mx-auto bg-slate-800/50 backdrop-blur-sm border border-slate-700/50 rounded-lg m-4 shadow-2xl">
        <!-- Header -->
        <header class="flex items-center justify-between p-4 border-b border-slate-700/50 bg-slate-800/30">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></div>
                <h1 class="text-xl font-bold text-white">AI Chat Assistant</h1>
                <span class="text-sm text-slate-400">Online</span>
            </div>
            <div class="flex items-center space-x-2">
                <button class="p-2 text-slate-400 hover:text-white transition-colors rounded-lg hover:bg-slate-700/50">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
                <button class="p-2 text-slate-400 hover:text-white transition-colors rounded-lg hover:bg-slate-700/50">
                    <i data-lucide="info" class="w-5 h-5"></i>
                </button>
                <button onclick="logout()" class="p-2 text-slate-400 hover:text-red-400 transition-colors rounded-lg hover:bg-slate-700/50">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <!-- Chat Messages -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-4 scrollbar-hide">
            <!-- Welcome Message -->
            <div class="flex justify-start">
                <div class="max-w-xs lg:max-w-md xl:max-w-lg">
                    <div class="bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-2xl rounded-tl-none px-4 py-3 message-bubble">
                        <p class="text-sm">Hello! I'm your AI assistant. How can I help you today?</p>
                        <p class="text-xs text-purple-200 mt-1 opacity-70">Just now</p>
                    </div>
                </div>
            </div>

            <!-- User messages and AI responses will be dynamically added here -->
        </div>

        <!-- Input Area -->
        <div class="p-4 border-t border-slate-700/50 bg-slate-800/30">
            <form id="chat-form" class="flex items-end space-x-3">
                <div class="flex-1 relative">
                    <textarea 
                        id="message-input"
                        placeholder="Type your message..."
                        class="w-full px-4 py-3 pr-12 bg-slate-700/50 border border-slate-600/50 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent resize-none max-h-32"
                        rows="1"
                    ></textarea>
                    <button type="button" class="absolute right-2 bottom-2 p-2 text-slate-400 hover:text-purple-400 transition-colors">
                        <i data-lucide="paperclip" class="w-4 h-4"></i>
                    </button>
                </div>
                <button 
                    type="submit"
                    class="px-4 py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-xl hover:from-purple-700 hover:to-pink-700 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed shadow-lg hover:shadow-purple-500/25"
                    id="send-button"
                >
                    <i data-lucide="send" class="w-5 h-5"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Auto-resize textarea
        const textarea = document.getElementById('message-input');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 128) + 'px';
        });

        // Handle form submission
        document.getElementById('chat-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const message = textarea.value.trim();
            if (!message) return;

            // Add user message
            addMessage(message, 'user');
            textarea.value = '';
            textarea.style.height = 'auto';

            // Show typing indicator
            showTypingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt: message })
                });
                
                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                
                const data = await response.json();
                
                // Remove typing indicator and add AI response
                removeTypingIndicator();
                addMessage(data.response || 'I received your message!', 'ai');
            } catch (error) {
                removeTypingIndicator();
                addMessage('Sorry, I encountered an error. Please try again.', 'ai');
            }
        });

        function addMessage(text, sender) {
            const messagesContainer = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} message-bubble`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = `max-w-xs lg:max-w-md xl:max-w-lg`;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = sender === 'user' 
                ? 'bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-2xl rounded-tr-none px-4 py-3'
                : 'bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-2xl rounded-tl-none px-4 py-3';
            
            bubbleDiv.innerHTML = `
                <p class="text-sm">${text}</p>
                <p class="text-xs ${sender === 'user' ? 'text-blue-200' : 'text-purple-200'} mt-1 opacity-70">Just now</p>
            `;
            
            contentDiv.appendChild(bubbleDiv);
            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);
            
            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTypingIndicator() {
            const messagesContainer = document.getElementById('chat-messages');
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typing-indicator';
            typingDiv.className = 'flex justify-start message-bubble';
            typingDiv.innerHTML = `
                <div class="max-w-xs">
                    <div class="bg-slate-700/50 rounded-2xl rounded-tl-none px-4 py-3">
                        <div class="flex space-x-1">
                            <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0ms"></div>
                            <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
                            <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
                        </div>
                    </div>
                </div>
            `;
            messagesContainer.appendChild(typingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) indicator.remove();
        }

        // Handle Enter key for sending messages
        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('chat-form').dispatchEvent(new Event('submit'));
            }
        });

        // Logout function
        async function logout() {
            try {
                await fetch('/auth/logout', { method: 'POST' });
                window.location.href = '/';
            } catch (error) {
                console.error('Logout failed:', error);
                window.location.href = '/';
            }
        }
    </script>
</body>
</html>
